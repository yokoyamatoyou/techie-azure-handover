# ============================================================
# TECHIE SaaS — ローカル開発用 Docker Compose
#
# Usage:
#   docker compose up --build
#   → http://localhost:8090 (HUB) から各サービスへアクセス
#
# 初回起動時:
#   docker compose up -d postgres
#   docker compose exec postgres psql -U techie -d techie -c "SELECT 1"
#   docker compose up --build
# ============================================================

services:
  # ==========================================
  # PostgreSQL (ローカル開発用)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: techie
      POSTGRES_PASSWORD: techie_dev_2026
      POSTGRES_DB: techie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techie"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # コトメイク (notecode) — ポート 8080
  # ==========================================
  kotomake:
    build:
      context: .
      dockerfile: notecode/Dockerfile
    environment:
      - PORT=8080
      - HEADLESS=1
      - CONTAINER_ENV=1
      - AUTH_DEV_MODE=1
      - DEV_TENANT_ID=dev-tenant-00000000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # コトミガキ (aio2-main) — ポート 8081
  # ==========================================
  kotomigaki:
    build:
      context: .
      dockerfile: aio2-main/Dockerfile
    environment:
      - PORT=8081
      - HEADLESS=1
      - CONTAINER_ENV=1
      - AUTH_DEV_MODE=1
      - DEV_TENANT_ID=dev-tenant-00000000
      - DATABASE_URL=postgresql://techie:techie_dev_2026@postgres:5432/techie?sslmode=disable
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # コトムスビ (doorknock) — ポート 8082
  # ==========================================
  kotomusubi:
    build:
      context: .
      dockerfile: doorknock/Dockerfile
    environment:
      - PORT=8082
      - HEADLESS=1
      - CONTAINER_ENV=1
      - PYTHONPATH=/app:/app/aio2-main
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8082:8082"
    depends_on:
      - kotomigaki

  # ==========================================
  # TECHIE HUB — ポート 8090
  # ==========================================
  hub:
    build:
      context: ./techie-hub
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/index.html"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      - kotomake
      - kotomigaki

volumes:
  pgdata:
