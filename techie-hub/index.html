<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TECHIE</title>
<link rel="icon" href="/assets/logo.svg?v=20260207b" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=20260804a">
<script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
<script src="/config.js?v=20260804a"></script>
<script src="/auth-provider-policy.js?v=20260804b"></script>
</head>
<body>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<div class="suite-shell">
  <header class="suite-nav">
    <a href="/" class="suite-nav-home">ホーム</a>
    <a href="/signup" class="suite-nav-link">新規登録</a>
    <a href="/login" class="suite-nav-link">ログイン</a>
    <a href="/onboarding" class="suite-nav-link">初期登録</a>
    <a href="/plans" class="suite-nav-link">プラン選択</a>
    <a href="/account" class="suite-nav-link">契約管理</a>
    <button class="suite-nav-button" id="logout-button" type="button" hidden>ログアウト</button>
  </header>
  <main id="app" class="suite-home" aria-live="polite"></main>
</div>

<script>
(function () {
  const config = window.TECHIE_CONFIG || {};
  const app = document.getElementById('app');
  const logoutButton = document.getElementById('logout-button');
  const placeholderPattern = /^%%.+%%$/;
  const serviceUrls = {
    kotomake: config.KOTOMAKE_URL,
    kotomigaki: config.KOTOMIGAKI_URL,
    kotomegane: config.KOTOMEGANE_URL
  };
  const SAFE_COUPON_ERROR = 'クーポンコードが無効、または期限切れです。コードを確認して再入力してください。';
  const authProviderPolicy = window.TECHIE_AUTH_PROVIDER_POLICY;
  const IDENTITY_LINK_TARGET_KEY = 'TECHIE_IDENTITY_LINK_TARGET';
  const IDENTITY_LINK_STATE_KEY = 'TECHIE_IDENTITY_LINK_STATE';
  const AUTH_TOKEN_SOURCE_KEY = 'TECHIE_AUTH_TOKEN_SOURCE';

  function isConfigured(value) {
    return Boolean(value && !placeholderPattern.test(String(value)));
  }

  function providerEnabled(provider) {
    return authProviderPolicy ? authProviderPolicy.providerEnabled(provider, config) : provider === 'email';
  }

  function providerAuthRequest(provider, intent) {
    if (authProviderPolicy && typeof authProviderPolicy.authRequest === 'function') {
      return authProviderPolicy.authRequest(provider, intent, config);
    }
    if (provider !== 'email') return null;
    return {
      prompt: intent === 'signup' ? 'create' : 'select_account',
      extraQueryParameters: { ui_locales: 'ja' }
    };
  }

  const authReady = isConfigured(config.ENTRA_AUTHORITY) && isConfigured(config.ENTRA_CLIENT_ID);
  const msalClient = authReady && window.msal ? new msal.PublicClientApplication({
    auth: {
      clientId: config.ENTRA_CLIENT_ID,
      authority: config.ENTRA_AUTHORITY,
      redirectUri: config.ENTRA_REDIRECT_URI || `${window.location.origin}/auth/callback`,
      postLogoutRedirectUri: config.ENTRA_POST_LOGOUT_REDIRECT_URI || `${window.location.origin}/signed-out`
    },
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false }
  }) : null;
  let redirectResultPromise = null;
  let interactiveAuthInProgress = false;
  let signupAutoStartTimer = null;
  let nativeEmailFlow = null;
  let nativeEmailPurpose = 'auth';
  let nativeEmailFixedEmail = '';

  function decodeJwtPayload(token) {
    try {
      const part = String(token || '').split('.')[1];
      if (!part) return {};
      const normalized = part.replace(/-/g, '+').replace(/_/g, '/');
      const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
      return JSON.parse(decodeURIComponent(escape(window.atob(padded))));
    } catch (_) {
      return {};
    }
  }

  function setStoredAuthToken(token, source = '') {
    if (!token) return;
    const claims = decodeJwtPayload(token);
    const expiresAt = Number(claims.exp || 0) * 1000;
    if (!expiresAt || expiresAt <= Date.now()) return;
    localStorage.setItem('TECHIE_AUTH_TOKEN', token);
    localStorage.setItem('TECHIE_AUTH_TOKEN_EXPIRES_AT', String(expiresAt));
    if (source === 'native' || source === 'msal') localStorage.setItem(AUTH_TOKEN_SOURCE_KEY, source);
  }

  function getStoredAuthToken() {
    const token = localStorage.getItem('TECHIE_AUTH_TOKEN') || '';
    const expiresAt = Number(localStorage.getItem('TECHIE_AUTH_TOKEN_EXPIRES_AT') || '0');
    if (!token || !expiresAt || expiresAt <= Date.now() + 60000) {
      clearStoredAuthToken(localStorage.getItem(AUTH_TOKEN_SOURCE_KEY) === 'native');
      return '';
    }
    return token;
  }

  function clearStoredAuthToken(blockCachedMsal = false) {
    localStorage.removeItem('TECHIE_AUTH_TOKEN');
    localStorage.removeItem('TECHIE_AUTH_TOKEN_EXPIRES_AT');
    if (blockCachedMsal) localStorage.setItem(AUTH_TOKEN_SOURCE_KEY, 'none');
    else localStorage.removeItem(AUTH_TOKEN_SOURCE_KEY);
  }

  function nativeAccount() {
    const token = getStoredAuthToken();
    if (!token) return null;
    const claims = decodeJwtPayload(token);
    if (!claims.sub && !claims.oid) return null;
    return {
      homeAccountId: claims.oid || claims.sub,
      name: claims.name || '',
      username: claims.email || claims.preferred_username || claims.signInNames?.emailAddress || '',
      native: true
    };
  }

  function hasAuthResponseInUrl() {
    const hash = window.location.hash || '';
    const search = window.location.search || '';
    return /[#&](code|error|state)=/.test(hash) || /[?&](code|error|state)=/.test(search);
  }

  function removeMsalInteractionState() {
    const stores = [window.localStorage, window.sessionStorage];
    for (const store of stores) {
      if (!store) continue;
      for (let i = store.length - 1; i >= 0; i -= 1) {
        const key = store.key(i) || '';
        if (key.includes('interaction.status')) {
          store.removeItem(key);
        }
      }
    }
  }

  function msalInteractionStateExists() {
    const stores = [window.localStorage, window.sessionStorage];
    for (const store of stores) {
      if (!store) continue;
      for (let i = 0; i < store.length; i += 1) {
        const key = store.key(i) || '';
        if (key.includes('interaction.status')) return true;
      }
    }
    return false;
  }

  async function ensureRedirectHandled() {
    if (!msalClient) return null;
    if (!redirectResultPromise) {
      redirectResultPromise = msalClient.handleRedirectPromise()
        .then(result => {
          if (result && result.account) msalClient.setActiveAccount(result.account);
          if (result) setStoredAuthToken(result.idToken || result.accessToken, 'msal');
          interactiveAuthInProgress = false;
          if (!hasAuthResponseInUrl()) removeMsalInteractionState();
          return result;
        })
        .catch(error => {
          interactiveAuthInProgress = false;
          removeMsalInteractionState();
          throw error;
        });
    }
    return redirectResultPromise;
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[ch]);
  }

  function userMessage(error) {
    const message = String(error && error.message ? error.message : error || '');
    if (error && error.code === 'identity_link_required') {
      return '既存アカウントとの安全な連携が必要です。元のログイン方法でログインし、契約管理からアカウントを連携してください。';
    }
    if (error && error.code === 'recent_authentication_required') {
      return '本人確認の有効期限が切れました。もう一度ログインしてから連携してください。';
    }
    if (error && error.code === 'identity_provider_mismatch') {
      return '選択したログイン方法と認証したアカウントの種類が一致しません。最初からやり直してください。';
    }
    if (error && error.code === 'identity_same_as_source') {
      return '現在のログインと同じアカウントです。追加する別のログイン方法で認証してください。';
    }
    if (error && error.code === 'identity_link_state_already_used') {
      return 'この連携操作は別の認証で使用済みです。契約管理から最初からやり直してください。';
    }
    if (/authentication failed/i.test(message)) {
      return '認証に失敗しました。再度ログインしてからお試しください。';
    }
    if (/failed to fetch/i.test(message)) {
      return 'APIに接続できませんでした。通信状態またはログイン状態を確認してください。';
    }
    if (/stripe price id/i.test(message)) {
      return 'Stripe 価格 ID が未設定です。';
    }
    return message || '処理に失敗しました。時間をおいて再度お試しください。';
  }

  function currentPath() {
    return window.location.pathname.replace(/\/$/, '') || '/';
  }

  function setView(markup) {
    app.innerHTML = markup;
    bindView();
  }

  function account() {
    const tokenSource = localStorage.getItem(AUTH_TOKEN_SOURCE_KEY) || '';
    if (tokenSource === 'none') return null;
    if (tokenSource === 'native') return nativeAccount();
    const msalAccount = msalClient
      ? (msalClient.getActiveAccount() || msalClient.getAllAccounts()[0] || null)
      : null;
    return msalAccount || nativeAccount();
  }

  function syncAccount() {
    const current = account();
    if (current && msalClient && !current.native) msalClient.setActiveAccount(current);
    logoutButton.hidden = !current;
    return current;
  }

  async function getToken() {
    const storedToken = getStoredAuthToken();
    if (storedToken) return storedToken;
    if (!msalClient) throw new Error('認証設定が未完了です。');
    const current = syncAccount();
    if (!current || current.native) throw new Error('ログインが必要です。');
    const request = { account: current, scopes: config.ENTRA_SCOPES || ['openid', 'profile', 'email'] };
    try {
      const result = await msalClient.acquireTokenSilent(request);
      const token = result.idToken || result.accessToken;
      setStoredAuthToken(token, 'msal');
      return token;
    } catch (_) {
      const storedToken = getStoredAuthToken();
      if (storedToken) return storedToken;
      await msalClient.acquireTokenRedirect({
        ...request,
        extraQueryParameters: { ui_locales: 'ja' }
      });
      throw new Error('認証画面へ移動しています。');
    }
  }

  async function apiFetch(endpoint, options = {}) {
    const token = await getToken();
    return apiFetchWithToken(endpoint, token, options);
  }

  async function apiFetchWithToken(endpoint, token, options = {}) {
    if (!token) throw new Error('ログインが必要です。');
    let response;
    try {
      response = await fetch(`${config.API_BASE_URL}${endpoint}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
    } catch (error) {
      throw new Error('APIに接続できませんでした。通信状態またはログイン状態を確認してください。');
    }
    const text = await response.text();
    let body = {};
    try { body = text ? JSON.parse(text) : {}; } catch (_) { body = {}; }
    if (!response.ok) {
      const detailObject = body.detail && typeof body.detail === 'object' ? body.detail : {};
      const detail = typeof body.detail === 'string' ? body.detail : String(detailObject.message || '');
      const safeDetail = detail && detail.length < 200 && !/[<>]/.test(detail)
        ? detail
        : `API リクエストに失敗しました: ${response.status}`;
      const error = new Error(safeDetail);
      error.status = response.status;
      error.code = body.code || detailObject.code || '';
      throw error;
    }
    return body;
  }

  async function anonymousApiFetch(endpoint, options = {}) {
    let response;
    try {
      response = await fetch(`${config.API_BASE_URL}${endpoint}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });
    } catch (_) {
      throw Object.assign(new Error('認証サービスに接続できませんでした。'), { code: 'native_auth_unavailable' });
    }
    const text = await response.text();
    let body = {};
    try { body = text ? JSON.parse(text) : {}; } catch (_) { body = {}; }
    if (!response.ok) {
      const detail = body.detail && typeof body.detail === 'object' ? body.detail : {};
      throw Object.assign(new Error('メール認証を続行できませんでした。'), {
        code: String(detail.code || body.code || 'native_auth_failed'),
        status: response.status
      });
    }
    return body;
  }

  function nativeEmailEnabled() {
    return Boolean(authProviderPolicy && authProviderPolicy.nativeEmailEnabled(config));
  }

  function delegatedEmailFallbackEnabled() {
    return Boolean(authProviderPolicy && authProviderPolicy.delegatedEmailFallbackEnabled(config));
  }

  function linkProviderEnabled(provider) {
    return Boolean(authProviderPolicy && authProviderPolicy.linkProviderEnabled(provider, config));
  }

  function nativeEmailMessage(error) {
    const code = String(error && error.code || '');
    if (code === 'email_invalid') return 'メールアドレスの形式を確認してください。';
    if (code === 'display_name_required') return 'お名前を入力してください。';
    if (code === 'native_auth_rate_limited') return '試行回数が上限に達しました。時間をおいてお試しください。';
    if (code === 'otp_invalid' || code === 'otp_invalid_or_expired') return '確認コードが正しくないか、有効期限が切れています。';
    if (code === 'native_flow_invalid' || code === 'native_flow_expired') return '確認コードの有効期限が切れました。最初からやり直してください。';
    if (code === 'native_signup_attributes_not_supported') return '登録に必要な項目の設定を確認できませんでした。サポートへお問い合わせください。';
    if (code === 'native_auth_fallback_required') return '現在このメール認証方式を利用できません。';
    return 'メール認証を開始できませんでした。時間をおいて再度お試しください。';
  }

  function authNotice() {
    if (authReady) return '';
    return `
      <div class="notice notice-danger">
        <strong>認証設定が未完了です。</strong>
        <span>顧客のログイン・決済テスト前に ENTRA_AUTHORITY と ENTRA_CLIENT_ID を設定してください。</span>
      </div>
    `;
  }

  function renderHome() {
    const current = syncAccount();
    setView(`
      <section class="hero-card">
        <div class="hero-brand">
          <img src="/assets/logo.svg?v=20260207b" alt="TECHIE" class="hero-logo">
          <p class="hero-tagline">作る、測る、改善する。</p>
        </div>
      </section>
      ${authNotice()}
      <section class="page-panel">
        <p class="eyebrow">ご利用開始</p>
        <h1>${current ? `ようこそ、${escapeHtml(current.name || current.username || 'ユーザー')}さん` : 'TECHIE を開始する'}</h1>
        <p class="hero-summary">${current
          ? 'プランの確認や契約管理、各サービスの利用はこちらから行えます。'
          : 'TECHIE の各サービスを、ひとつのアカウントでご利用いただけます。初めての方は新規登録、登録済みの方はログインしてください。'}</p>
        <div class="button-row">
          ${current
            ? '<a class="button button-primary" href="/plans">プランを選択</a><a class="button button-secondary" href="/account">契約を管理</a>'
            : '<a class="button button-primary" href="/signup">新規登録</a><a class="button button-secondary" href="/login">ログイン</a>'}
        </div>
      </section>
      <section class="section-block">
        <div class="core-grid">
          ${serviceCard('kotomake', 'コトメイク', 'ブログ生成でオウンドメディアの流入導線を作ります。')}
          ${serviceCard('kotomegane', 'コトメガネ', 'AI 検索上での自社の見え方を観測します。')}
          ${serviceCard('kotomigaki', 'コトミガキ', 'Web サイトを分析し、改善点を明確にします。')}
        </div>
      </section>
    `);
  }

  function serviceCard(key, title, purpose) {
    return `
      <article class="suite-card suite-card-${key}">
        <h3>${title}</h3>
        <p class="card-purpose">${purpose}</p>
        <button class="button button-primary service-open" data-service="${key}" type="button">サービスを開く</button>
      </article>
    `;
  }

  function authMethodChooser(mode) {
    const action = mode === 'signup' ? '登録' : 'ログイン';
    const emailEnabled = providerEnabled('email');
    const emailNative = nativeEmailEnabled();
    const emailFallback = delegatedEmailFallbackEnabled();
    const googleEnabled = providerEnabled('google');
    return `
      <div class="auth-methods" aria-label="${action}方法">
        <button class="auth-method-row${emailEnabled ? (emailNative ? ' native-email-start' : ' auth-start') : ''}" ${emailEnabled ? `data-auth-mode="${mode}" data-auth-provider="email"` : 'disabled'} type="button">
          <span class="auth-method-content">
            <span class="auth-method-heading">
              <span class="auth-method-name">メールアドレス</span>
              <span class="auth-method-badge${emailEnabled ? '' : ' auth-method-badge-construction'}">${emailNative ? '現在利用可能' : emailFallback ? '緊急フォールバック' : '準備中'}</span>
            </span>
            <span class="auth-method-detail">${emailNative
              ? 'Outlook、Hotmail、Microsoft 365を含むメールアドレスに確認コードを送ります。'
              : emailFallback
                ? '従来のEntra認証画面を開きます。認証方法の選択が再表示される場合があります。'
                : '分かりやすいメール確認コード画面を安全に準備しています。'}</span>
          </span>
          <span class="auth-method-action">${emailEnabled ? `メールで${action}` : '準備中'}</span>
        </button>
        <button class="auth-method-row${googleEnabled ? ' auth-start' : ''}" ${googleEnabled ? `data-auth-mode="${mode}" data-auth-provider="google"` : 'disabled'} type="button">
          <span class="auth-method-content">
            <span class="auth-method-heading">
              <span class="auth-method-name">Google</span>
              <span class="auth-method-badge auth-method-badge-test">${googleEnabled ? 'テスト提供中' : '確認待ち'}</span>
            </span>
            <span class="auth-method-detail">Google のアカウント選択画面へ進みます。</span>
          </span>
          <span class="auth-method-action">Googleで${action}</span>
        </button>
      </div>
    `;
  }

  function renderNativeEmailForm(mode, message = '', purpose = 'auth', fixedEmail = '') {
    nativeEmailFlow = null;
    nativeEmailPurpose = purpose;
    nativeEmailFixedEmail = fixedEmail;
    const signup = mode === 'signup';
    const linking = purpose === 'link_source' || purpose === 'link_target';
    const heading = purpose === 'link_source'
      ? '現在のメール認証をもう一度確認'
      : purpose === 'link_target'
        ? (signup ? '新しいメール認証を作成して追加' : '既存のメール認証を追加')
        : (signup ? 'メールアドレスで新規登録' : 'メールアドレスでログイン');
    const emailValue = fixedEmail ? ` value="${escapeHtml(fixedEmail)}" readonly` : '';
    setView(`
      <section class="page-panel login-panel native-email-panel">
        <p class="eyebrow">メール認証</p>
        <h1>${heading}</h1>
        <p class="hero-summary">入力したメールアドレスへ確認コードを送ります。この画面で入力するメールアドレスは1回だけです。</p>
        ${message ? `<div class="notice notice-warn" role="alert">${escapeHtml(message)}</div>` : ''}
        <form id="native-email-start-form" class="native-auth-form" data-auth-mode="${mode}" data-auth-purpose="${purpose}">
          ${signup ? '<label>お名前<input name="display_name" required maxlength="128" autocomplete="name"></label>' : ''}
          <label>メールアドレス<input name="email" required maxlength="254" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false"${emailValue}></label>
          <div class="button-row">
            <button class="button button-primary" type="submit">確認コードを送る</button>
            <a class="button button-secondary" href="${linking ? '/account' : `/${mode}`}">${linking ? '契約管理へ戻る' : '方法選択へ戻る'}</a>
          </div>
        </form>
      </section>
    `);
    document.querySelector('#native-email-start-form input')?.focus();
  }

  function renderNativeEmailCode(mode, challenge, purpose = nativeEmailPurpose) {
    const codeLength = Number(challenge.code_length || 0);
    const target = String(challenge.challenge_target_label || '入力したメールアドレス');
    setView(`
      <section class="page-panel login-panel native-email-panel">
        <p class="eyebrow">メール認証</p>
        <h1>確認コードを入力</h1>
        <p class="hero-summary">${escapeHtml(target)} に送信された${escapeHtml(codeLength)}桁の確認コードを入力してください。</p>
        <form id="native-email-verify-form" class="native-auth-form" data-auth-mode="${mode}" data-auth-purpose="${purpose}">
          <label>確認コード<input name="code" required type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{${escapeHtml(codeLength)}}" minlength="${escapeHtml(codeLength)}" maxlength="${escapeHtml(codeLength)}"></label>
          <div id="native-email-result" aria-live="polite"></div>
          <div class="button-row">
            <button class="button button-primary" type="submit">確認して続ける</button>
            <button class="button button-secondary native-email-restart" data-auth-mode="${mode}" data-auth-purpose="${purpose}" type="button">最初からやり直す</button>
          </div>
        </form>
      </section>
    `);
    document.querySelector('#native-email-verify-form input')?.focus();
  }

  function renderNativeEmailLinkTargetChoice() {
    setView(`
      <section class="page-panel login-panel native-email-panel">
        <p class="eyebrow">ログイン方法を追加</p>
        <h1>追加するメール認証を選択</h1>
        <p class="hero-summary">追加するメールアドレスをもう一度認証します。メールアドレスが同じという理由だけでは統合しません。</p>
        <div class="auth-methods" aria-label="追加するメール認証">
          <button class="auth-method-row native-email-link-target" data-auth-mode="login" type="button">
            <span class="auth-method-content"><span class="auth-method-name">既存のメール認証を追加</span><span class="auth-method-detail">すでにTECHIEでメール認証を利用している場合</span></span>
          </button>
          <button class="auth-method-row native-email-link-target" data-auth-mode="signup" type="button">
            <span class="auth-method-content"><span class="auth-method-name">新しいメール認証を作成して追加</span><span class="auth-method-detail">新しいメールアドレスを確認して追加する場合</span></span>
          </button>
        </div>
        <a class="button button-secondary" href="/account">契約管理へ戻る</a>
      </section>

  async function startNativeEmail(form) {
    const data = new FormData(form);
    const mode = form.dataset.authMode === 'signup' ? 'signup' : 'login';
    const purpose = form.dataset.authPurpose || 'auth';
    const submit = form.querySelector('button[type="submit"]');
    if (submit) submit.disabled = true;
    try {
      const challenge = await anonymousApiFetch('/api/auth/native-email/start', {
        method: 'POST',
        body: JSON.stringify({
          email: String(data.get('email') || '').trim(),
          intent: mode,
          display_name: String(data.get('display_name') || '').trim()
        })
      });
      nativeEmailFlow = String(challenge.flow_token || '');
      if (!nativeEmailFlow) throw Object.assign(new Error('flow missing'), { code: 'native_auth_failed' });
      renderNativeEmailCode(mode, challenge, purpose);
    } catch (error) {
      renderNativeEmailForm(mode, nativeEmailMessage(error), purpose, nativeEmailFixedEmail);
    }
  }

  async function verifyNativeEmail(form) {
    const mode = form.dataset.authMode === 'signup' ? 'signup' : 'login';
    const purpose = form.dataset.authPurpose || 'auth';
    const code = String(new FormData(form).get('code') || '').trim();
    const resultTarget = document.getElementById('native-email-result');
    const submit = form.querySelector('button[type="submit"]');
    if (!nativeEmailFlow) return renderNativeEmailForm(mode, '確認コードの有効期限が切れました。最初からやり直してください。', purpose, nativeEmailFixedEmail);
    if (submit) submit.disabled = true;
    if (resultTarget) resultTarget.innerHTML = '<div class="notice">確認しています...</div>';
    try {
      const result = await anonymousApiFetch('/api/auth/native-email/verify', {
        method: 'POST',
        body: JSON.stringify({ flow_token: nativeEmailFlow, code })
      });
      nativeEmailFlow = null;
      const verifiedToken = String(result.id_token || '');
      setStoredAuthToken(verifiedToken, 'native');
      if (!nativeAccount()) throw Object.assign(new Error('token rejected'), { code: 'native_auth_failed' });
      if (purpose === 'link_source') return prepareIdentityLink();
      if (purpose === 'link_target') return completeIdentityLink();
      window.history.replaceState({}, document.title, mode === 'signup' ? '/onboarding' : '/');
      return mode === 'signup' ? renderOnboarding() : renderHome();
    } catch (error) {
      if (submit) submit.disabled = false;
      if (resultTarget) resultTarget.innerHTML = `<div class="notice notice-warn" role="alert">${escapeHtml(nativeEmailMessage(error))}</div>`;
    }
  }

  async function renderCallback() {
    setView('<section class="page-panel"><h1>ログイン処理中です...</h1></section>');
    if (!msalClient) return renderLogin('login');
    await ensureRedirectHandled();
    const intent = sessionStorage.getItem('TECHIE_AUTH_INTENT') || 'login';
    sessionStorage.removeItem('TECHIE_AUTH_INTENT');
    if (intent === 'link_prepare') {
      window.history.replaceState({}, document.title, '/account');
      return prepareIdentityLink();
    }
    if (intent === 'link_complete') {
      window.history.replaceState({}, document.title, '/account');
      return completeIdentityLink();
    }
    window.history.replaceState({}, document.title, intent === 'signup' ? '/onboarding' : '/');
    return intent === 'signup' ? renderOnboarding() : renderHome();
  }

  function identityProviderLabel(value) {
    const provider = String(value || '').toLowerCase();
    if (provider === 'google') return 'Google';
    if (provider === 'microsoft') return 'Microsoft';
    if (provider === 'email') return 'メール';
    return 'Entraで管理されるログイン方法';

  async function loadIdentityBindings() {

  async function beginIdentityLink(provider) {
    if (!linkProviderEnabled(provider)) {
      throw new Error('このログイン方法は現在利用できません。');
    }
    const current = syncAccount();
    if (!current) throw new Error('ログインが必要です。');
    sessionStorage.setItem(IDENTITY_LINK_TARGET_KEY, provider);
    if (current.native) {
      return renderNativeEmailForm('login', '', 'link_source', current.username || '');
    }
    if (!msalClient) throw new Error('ログインが必要です。');
    sessionStorage.setItem('TECHIE_AUTH_INTENT', 'link_prepare');
    interactiveAuthInProgress = true;
    await msalClient.loginRedirect({
      account: account(),
      scopes: config.ENTRA_SCOPES || ['openid', 'profile', 'email'],
      prompt: 'login',
      extraQueryParameters: { ui_locales: 'ja' }
    });
  }

  async function prepareIdentityLink() {
    const provider = sessionStorage.getItem(IDENTITY_LINK_TARGET_KEY) || '';
    if (!provider) return renderAccount();
    if (!linkProviderEnabled(provider)) {
      sessionStorage.removeItem(IDENTITY_LINK_TARGET_KEY);
      throw new Error('このログイン方法は現在利用できません。');
    }
    const intent = await apiFetch('/api/identity/link-intents', {
      method: 'POST',
      body: JSON.stringify({ provider })
    });
    sessionStorage.setItem(IDENTITY_LINK_STATE_KEY, intent.state);
    if (provider === 'email' && nativeEmailEnabled()) {
      return renderNativeEmailLinkTargetChoice();
    }
    sessionStorage.setItem('TECHIE_AUTH_INTENT', 'link_complete');
    const request = providerAuthRequest(provider, 'link');
    if (!request) throw new Error('このログイン方法は現在利用できません。');
    interactiveAuthInProgress = true;
    await msalClient.loginRedirect({
      scopes: config.ENTRA_SCOPES || ['openid', 'profile', 'email'],
      ...request
    });
  }

  async function completeIdentityLink() {
    const state = sessionStorage.getItem(IDENTITY_LINK_STATE_KEY) || '';
    try {
      if (!state) throw new Error('アカウント連携の有効期限が切れました。最初からやり直してください。');
      const targetToken = getStoredAuthToken();
      await apiFetchWithToken('/api/identity/link-complete', targetToken, {
        method: 'POST',
        body: JSON.stringify({ state })
      });
      sessionStorage.removeItem(IDENTITY_LINK_STATE_KEY);
      sessionStorage.removeItem(IDENTITY_LINK_TARGET_KEY);
      await renderAccount();
      const target = document.getElementById('identity-bindings');
      if (target) target.insertAdjacentHTML('beforebegin', '<div class="notice"><strong>ログイン方法を追加しました。</strong></div>');
    } catch (error) {
      sessionStorage.removeItem(IDENTITY_LINK_STATE_KEY);
      sessionStorage.removeItem(IDENTITY_LINK_TARGET_KEY);
      clearStoredAuthToken(true);
      syncAccount();
      setView(`<section class="page-panel"><h1>アカウント連携を完了できませんでした</h1><p>${escapeHtml(userMessage(error))}</p><p>安全のためログイン状態を終了しました。もう一度ログインしてください。</p><a class="button button-primary" href="/login">ログインへ戻る</a></section>`);
    }
  }

  async function startLogin(mode = 'login', provider = '') {
    if (signupAutoStartTimer) {
      clearTimeout(signupAutoStartTimer);
      signupAutoStartTimer = null;
    }
    if (!authReady) {
      alert('認証設定が未完了です。');
      return;
    }
    if (!providerEnabled(provider)) {
      alert('このログイン方法は現在利用できません。');
      return;
    }
    if (provider === 'email' && nativeEmailEnabled()) {
      renderNativeEmailForm(mode);
      return;
    }
    if (!msalClient) {
      alert('Microsoft ログインライブラリの読み込みに失敗しました。再読み込みして再度お試しください。');
      return;
    }
    await ensureRedirectHandled();
    if (interactiveAuthInProgress || msalInteractionStateExists()) {
      console.info('MSAL interaction is already in progress; duplicate login request skipped.');
      return;
    }
    interactiveAuthInProgress = true;
    sessionStorage.setItem('TECHIE_AUTH_INTENT', mode);
    try {
      const request = providerAuthRequest(provider, mode === 'signup' ? 'signup' : 'login');
      if (!request) throw new Error('このログイン方法は現在利用できません。');
      await msalClient.loginRedirect({
        scopes: config.ENTRA_SCOPES || ['openid', 'profile', 'email'],
        ...request
      });
    } catch (error) {
      interactiveAuthInProgress = false;
      if (String(error && error.errorCode || '').includes('interaction_in_progress')) {
        removeMsalInteractionState();
        console.warn('Stale MSAL interaction state was cleared. Please try the login action again.');
        return;
      }
      throw error;
    }
  }

  async function openCheckout(planKey, profile = {}) {
    const plan = (config.PLANS || []).find(item => item.key === planKey);
    if (!plan || !isConfigured(plan.stripePriceId)) {
      alert('このプランの Stripe 価格 ID が未設定です。');
      return;
    }
    const result = await apiFetch('/api/billing/checkout-session', {
      method: 'POST',
      body: JSON.stringify({
        price_id: plan.stripePriceId,
        success_url: `${window.location.origin}/account?checkout=success`,
        cancel_url: `${window.location.origin}/plans?checkout=cancel`,
        service_code: plan.serviceCode,
        service_name: plan.serviceName,
        plan_id: plan.key,
        checkout_mode: plan.checkoutMode || 'subscription',
        credit_grant_amount: plan.creditGrantAmount || 0,
        company_name: profile.company_name || '',
        display_name: profile.contact_name || profile.company_name || '',
        customer_email: profile.customer_email || ''
      })
    });
    window.location.href = result.url;
  }

  async function redeemCoupon(form) {
    const resultTarget = document.getElementById('coupon-result');

    const code = String(data.get('coupon_code') || '').trim();

    if (resultTarget) resultTarget.textContent = 'クーポンを確認しています...';

    }).catch(error => {
      if (resultTarget) resultTarget.innerHTML = `<span class="text-danger">${escapeHtml(SAFE_COUPON_ERROR)}</span>`;
      throw error;
    });
    if (resultTarget) {
      resultTarget.innerHTML = result.idempotent_replay
        ? '<span class="text-danger">このクーポンは既に利用済みです。</span>'
        : `<span class="text-success">${escapeHtml(result.coupon_units || 1)} クレジットを付与しました。</span>`;

  async function refreshCredits() {
    const target = document.getElementById('credit-summary');
    if (!target) return;
    target.innerHTML = '<div class="notice">クレジット残高を取得中です。</div>';
    const keys = ['kotomake', 'kotomigaki', 'kotomegane'];
    const serviceLabels = {
      kotomake: 'コトメイク',
      kotomigaki: 'コトミガキ',
      kotomegane: 'コトメガネ'
    };
    const rows = [];
    for (const key of keys) {
      try {
        const summary = await apiFetch(`/api/usage/summary?service_key=${encodeURIComponent(key)}`);
        rows.push(`<article class="mini-card"><strong>${serviceLabels[key]}</strong><span>合計残高: ${escapeHtml(summary.remaining_credits ?? summary.total_remaining ?? '-')}</span><span>月間: ${escapeHtml(summary.included_credits_remaining ?? '-')}</span><span>買い切り: ${escapeHtml(summary.purchased_credits_remaining ?? '-')}</span></article>`);
      } catch (error) {
        rows.push(`<article class="mini-card"><strong>${serviceLabels[key]}</strong><span class="text-danger">${escapeHtml(userMessage(error))}</span></article>`);
      }
    }
    target.innerHTML = rows.join('');
  }

  async function syncAndRefreshCredits() {
    const target = document.getElementById('credit-summary');
    try {
      await syncBillingFromStripe();
    } catch (error) {
      console.warn('Stripe subscription sync failed before credit refresh:', error);
      if (target) target.innerHTML = `<div class="notice notice-warn">${escapeHtml(userMessage(error))}</div>`;
    }
    await refreshCredits();
  }

  async function openService(key) {
    const baseUrl = serviceUrls[key];
    if (!baseUrl) return;
    try {
      await syncBillingFromStripe().catch(error => console.warn('Stripe subscription sync failed before service open:', error));
      const token = await getToken();
      const url = new URL(baseUrl);
      url.searchParams.set('access_token', token);
      url.searchParams.set('return_to', window.location.origin + '/account');
      window.location.href = url.toString();
    } catch (_) {
      window.location.href = `/login?next=${encodeURIComponent(`/service/${key}`)}`;
    }
  }

  function bindView() {
    document.getElementById('login-start')?.addEventListener('click', event => {
      startLogin(event.currentTarget.dataset.authMode || 'login');
    });
    document.querySelectorAll('.auth-start').forEach(button => {
      button.addEventListener('click', event => {
        startLogin(
          event.currentTarget.dataset.authMode || 'login',
          event.currentTarget.dataset.authProvider || ''
        );
      });
    });
    document.querySelectorAll('.native-email-start').forEach(button => {
      button.addEventListener('click', event => {
        renderNativeEmailForm(event.currentTarget.dataset.authMode === 'signup' ? 'signup' : 'login');
      });
    });
    document.getElementById('native-email-start-form')?.addEventListener('submit', event => {
      event.preventDefault();
      startNativeEmail(event.currentTarget);
    });
    document.getElementById('native-email-verify-form')?.addEventListener('submit', event => {
      event.preventDefault();
      verifyNativeEmail(event.currentTarget);
    });
    document.querySelectorAll('.native-email-restart').forEach(button => {
      button.addEventListener('click', event => renderNativeEmailForm(
        event.currentTarget.dataset.authMode || 'login',
        '',
        event.currentTarget.dataset.authPurpose || 'auth',
        event.currentTarget.dataset.authPurpose === 'link_source' ? nativeEmailFixedEmail : ''
      ));
    });
    document.querySelectorAll('.native-email-link-target').forEach(button => {
      button.addEventListener('click', event => renderNativeEmailForm(
        event.currentTarget.dataset.authMode === 'signup' ? 'signup' : 'login',
        '',
        'link_target'
      ));
    });
    document.getElementById('onboarding-form')?.addEventListener('submit', event => {
      event.preventDefault();
      const profile = collectOnboardingProfile(event.currentTarget);
      localStorage.setItem('TECHIE_ONBOARDING_PROFILE', JSON.stringify(profile));
      openCheckout(profile.plan_key, profile).catch(err => alert(userMessage(err)));
    });
    document.getElementById('portal-button')?.addEventListener('click', () => openPortal().catch(err => alert(userMessage(err))));
    document.getElementById('refresh-credits')?.addEventListener('click', () => syncAndRefreshCredits().catch(err => alert(userMessage(err))));
    document.querySelectorAll('.identity-link-start').forEach(button => {
      button.addEventListener('click', () => beginIdentityLink(button.dataset.linkProvider || '').catch(err => alert(userMessage(err))));
    });
    document.getElementById('coupon-form')?.addEventListener('submit', event => {
      event.preventDefault();
      redeemCoupon(event.currentTarget).catch(err => {
        const resultTarget = document.getElementById('coupon-result');
        if (resultTarget) resultTarget.innerHTML = `<span class="text-danger">${escapeHtml(SAFE_COUPON_ERROR)}</span>`;
      });
    });
    document.querySelectorAll('.checkout-button').forEach(button => {
      button.addEventListener('click', () => openCheckout(button.dataset.plan).catch(err => alert(userMessage(err))));
    });
    document.querySelectorAll('.service-open').forEach(button => {
      button.addEventListener('click', () => openService(button.dataset.service));
    });
    if (document.getElementById('credit-summary')) {
      setTimeout(() => syncAndRefreshCredits().catch(error => console.warn('Initial credit refresh failed:', error)), 250);
    }
    if (document.getElementById('identity-bindings')) {
      setTimeout(() => loadIdentityBindings().catch(error => console.warn('Identity binding refresh failed:', error)), 100);
    }
  }

  logoutButton.addEventListener('click', async () => {
    const current = account();
    localStorage.removeItem('TECHIE_AUTH_TOKEN');
    localStorage.removeItem('TECHIE_AUTH_TOKEN_EXPIRES_AT');
    localStorage.removeItem(AUTH_TOKEN_SOURCE_KEY);
    nativeEmailFlow = null;
    if (current && current.native) {
      window.location.href = '/signed-out';
      return;
    }
    if (msalClient) await msalClient.logoutRedirect({ account: current || undefined });
  });

  async function route() {
    await ensureRedirectHandled();
    syncAccount();
    const routePath = currentPath();
    if (routePath === '/auth/callback' || routePath === '/callback') return renderCallback();
    if (routePath === '/signup') return renderSignupRedirect();
    if (routePath === '/login') return renderLogin('login');
    if (routePath === '/onboarding') return renderOnboarding();
    if (routePath === '/plans') return renderPlans();
    if (routePath === '/account' || routePath === '/billing') return renderAccount();
    if (routePath === '/admin/users') return renderAdminUsers();
    if (routePath === '/signed-out') return renderSignedOut();
    if (routePath.startsWith('/service/')) return openService(routePath.split('/').pop());
    return renderHome();
  }

  route().catch(error => {
    console.error(error);
    setView(`<section class="page-panel"><h1>エラー</h1><p>${escapeHtml(userMessage(error))}</p></section>`);
  });
})();
</script>
</body>
</html>
